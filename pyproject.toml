[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgNA-plus"
version = "0.1.0"
description = "Python tools for cgNA+ nucleic acid modelling"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["cgNA_plus*"]
